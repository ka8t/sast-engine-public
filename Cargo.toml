[package]
name = "sast-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
crc32fast = "1.4.2"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
fancy-regex = "0.19.0"
postgres = "0.19.10"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
shell-words = "1.1.0"
tree-sitter = "0.26.13"
tree-sitter-c-sharp = "0.23.5"
# No official crate under the `tree-sitter`/`tree-sitter-grammars` GitHub organization for
# Dockerfile (less standardized grammar, see ticket #69): a community fork,
# more active than the original `tree-sitter-dockerfile` crate (215K
# downloads, updated 2025-09 vs 22K/2024-05) — a decision settled with
# the maintainer rather than improvised, see the ticket.
tree-sitter-dockerfile-updated = "0.2.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
which = "8.0.0"

# chacha20poly1305/sha2: for src/rules/rules_crypto.rs shared with
# build.rs (ticket #65 — encryption of the embedded rule catalog at
# compile time). Versions aligned with [dependencies] for hygiene.
[build-dependencies]
chacha20poly1305 = "0.10.1"
serde_json = "1.0.151"
sha2 = "0.11.0"
